[tools]
golangci-lint = "2.9.0"

[tasks.lint-go]
alias = "lint"
description = 'Lint and format go code'
usage = '''
flag "-n --dry-run" default=#false help="Print diffs rather than automatically applying fixes"
'''
run = '''
set -x
go mod tidy{% if usage.dry_run or env.CI %} -diff{% endif %}|| result=$?
golangci-lint run{% if env.CI %} -v{% endif %}{% if not (usage.dry_run or env.CI) %} --fix{% endif %} || result=$?
golangci-lint fmt{% if env.CI %} -v{% endif %}{% if usage.dry_run or env.CI %} --diff{% endif %} || result=$?
./etc/lint_register_apis.sh || result=$?
exit ${result:-0}
'''