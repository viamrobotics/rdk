name: Viam CLI

on:
  workflow_dispatch:
    inputs:
      release_type:
        default: pr
        required: true
        type: choice
        options: [pr, latest, stable]
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
    secrets:
      GCP_CREDENTIALS:
        required: true

jobs:
  viam-cli:
    runs-on: ubuntu-large
    steps:
    - name: Check out code
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check out PR branch code
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        # Fork PRs only reach pull_request_target runs behind the 'safe to test' label (see pullrequest-trusted.yml).
        allow-unsafe-pr-checkout: true

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: build
      shell: bash
      env:
        CI_RELEASE: ${{ inputs.release_type }}
      run: |
        pids=()
        GOOS=linux   GOARCH=amd64                    make cli-ci & pids+=($!)
        GOOS=linux   GOARCH=arm64                    make cli-ci & pids+=($!)
        GOOS=darwin  GOARCH=amd64                    make cli-ci & pids+=($!)
        GOOS=darwin  GOARCH=arm64                    make cli-ci & pids+=($!)
        GOOS=windows GOARCH=amd64 EXE_SUFFIX=.exe   make cli-ci & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid" || exit 1; done

    # Share the windows binary with the cli-windows-installer job so it doesn't
    # need to recompile from source.
    - name: Upload Windows binary as artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: viam-cli-windows-amd64
        path: bin/windows-amd64/viam-cli
        if-no-files-found: warn
        retention-days: 1

    - name: tagged alias
      shell: bash
      env:
         CI_RELEASE: ${{ github.ref_name }}
      if: inputs.release_type == 'stable'
      run: |
        pids=()
        GOOS=linux   GOARCH=amd64                    make cli-ci & pids+=($!)
        GOOS=linux   GOARCH=arm64                    make cli-ci & pids+=($!)
        GOOS=darwin  GOARCH=amd64                    make cli-ci & pids+=($!)
        GOOS=darwin  GOARCH=arm64                    make cli-ci & pids+=($!)
        GOOS=windows GOARCH=amd64 EXE_SUFFIX=.exe   make cli-ci & pids+=($!)
        for pid in "${pids[@]}"; do wait "$pid" || exit 1; done

    - name: Authorize GCP Upload
      if: inputs.release_type != 'pr'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    - name: upload
      if: inputs.release_type != 'pr'
      uses: google-github-actions/upload-cloud-storage@v0.10.4
      with:
        headers: "cache-control: no-cache"
        path: 'bin/deploy-ci'
        glob: 'viam-cli-*'
        destination: 'packages.viam.com/apps/viam-cli/'
        parent: false

    - name: Validate module schema
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
        cache-dependency-path: cli/test-requirements.txt
    - run: |
        go run -tags no_cgo ./cli/viam/ module create --local-only --name schematest --public-namespace ns
        cat meta.json | jq '.models = [{"api": "x:y:z", "model": "x:y:z"}]' > meta2.json
        python -m venv .venv
        source .venv/bin/activate
        pip install -r cli/test-requirements.txt
        check-jsonschema --schemafile ./cli/module.schema.json meta2.json
        rm meta.json meta2.json

  viam-cli-deb:
    runs-on: ubuntu-large
    permissions:
      contents: "read"
      id-token: "write" # WIF auth for the stable upload
    steps:
    - name: Check out code
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
      # actions/checkout@v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Check out PR branch code
      if: github.event_name == 'pull_request_target'
      # actions/checkout@v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        # Fork PRs only reach pull_request_target runs behind the 'safe to test' label (see pullrequest-trusted.yml).
        allow-unsafe-pr-checkout: true

    # actions/setup-go@v7.0.0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod

    - name: build debs
      shell: bash
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
      run: |
        # only stable tags carry a real version
        if [ "$RELEASE_TYPE" != stable ]; then
          export TAG_VERSION='0.0.0~ci'
        fi
        GOOS=linux GOARCH=amd64 make deb-cli
        GOOS=linux GOARCH=arm64 make deb-cli

    - name: install test amd64
      run: |
        for img in debian:bookworm ubuntu:24.04; do
          docker run --rm -v "$PWD/bin/deb:/deb:ro" "$img" \
            bash -ec 'apt-get update -qq && apt-get install -yqq /deb/viam-cli_*_amd64.deb >/dev/null && viam version'
        done

    - name: install test arm64 (qemu)
      continue-on-error: true # emulation is best-effort
      run: |
        docker run --privileged --rm tonistiigi/binfmt --install arm64
        docker run --platform linux/arm64 --rm -v "$PWD/bin/deb:/deb:ro" debian:bookworm \
          bash -ec 'apt-get update -qq && apt-get install -yqq /deb/viam-cli_*_arm64.deb >/dev/null && viam version'

    - name: Authorize GAR upload
      if: inputs.release_type == 'stable'
      # google-github-actions/auth@v3
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: projects/785265540/locations/global/workloadIdentityPools/github-rdk-id/providers/github-provider-rdk
        service_account: rdk-apt-publisher@static-file-server-310021.iam.gserviceaccount.com
    - name: Set up gcloud
      if: inputs.release_type == 'stable'
      # google-github-actions/setup-gcloud@v3.0.1
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: upload to apt repo
      if: inputs.release_type == 'stable'
      run: make deb-cli-upload

  # installs from the published repo exactly as the docs describe
  viam-cli-apt-e2e:
    if: inputs.release_type == 'stable'
    needs: viam-cli-deb
    runs-on: ubuntu-large
    permissions:
      contents: "read"
    steps:
    - name: Check out code
      # actions/checkout@v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: apt install e2e
      env:
        EXPECTED_VERSION: ${{ github.ref_name }}
      run: |
        for img in debian:bookworm ubuntu:24.04; do
          docker run --rm -v "$PWD/etc/apt-e2e.sh:/apt-e2e.sh:ro" \
            -e EXPECTED_VERSION="${EXPECTED_VERSION#v}" "$img" bash /apt-e2e.sh
        done
