name: CLA Gate

# Posts the required `cla/gate` commit status: success when every PR committer is a viamrobotics
# member, otherwise a copy of cla-assistant.io's `license/cla`. Dispatch backfills all open PRs.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cla-gate-${{ github.event.pull_request.head.sha || github.event.sha || 'backfill' }}
  cancel-in-progress: false

jobs:
  cla-gate:
    if: >-
      github.repository_owner == 'viamrobotics' &&
      (github.event_name != 'status' || github.event.context == 'license/cla')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # GITHUB_TOKEN only sees public org members; the CI app has "Members: read".
      - name: Mint org members token
        id: app-token
        # actions/create-github-app-token@v3.3.0
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Post cla/gate status
        # actions/github-script@v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ORG_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // Honored only on same-repo PRs, matching pr-labeler.yml.
            const trustedBots = ['dependabot[bot]', 'github-actions[bot]', 'viam-ci-org-reader[bot]', 'viam-overwatch[bot]'];
            const orgClient = getOctokit(process.env.ORG_TOKEN);
            const membership = new Map();
            const isMember = (login) => {
              if (!membership.has(login)) {
                membership.set(login, orgClient.rest.orgs.checkMembershipForUser({ org: owner, username: login }).then(
                  (res) => res.status === 204,
                  (err) => { if (err.status === 404) return false; throw err; },
                ));
              }
              return membership.get(login);
            };

            let pulls;
            if (context.payload.pull_request) {
              pulls = [context.payload.pull_request];
            } else {
              // commits/{sha}/pulls omits fork PRs, so match head SHAs against the open PR list.
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
              pulls = context.eventName === 'status' ? open.filter((pr) => pr.head.sha === context.payload.sha) : open;
            }

            for (const pr of pulls) {
              const isFork = pr.head.repo?.full_name !== pr.base.repo.full_name;
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
              // Same identity cla-assistant.io checks: the author's GitHub user, else the committer's.
              const logins = new Set([pr.user.login, ...commits.map((c) => c.author?.login ?? c.committer?.login ?? null)]);
              const outsiders = [];
              for (const login of logins) {
                const trusted = login !== null && ((!isFork && trustedBots.includes(login)) || await isMember(login));
                if (!trusted) outsiders.push(login ?? 'unlinked commit author');
              }

              let status = { state: 'success', description: 'All committers are viamrobotics members' };
              if (outsiders.length > 0) {
                const { data } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
                const cla = data.statuses.find((s) => s.context === 'license/cla');
                status = {
                  state: cla?.state ?? 'pending',
                  description: `license/cla ${cla?.state ?? 'not reported'} for ${outsiders.join(', ')}`.slice(0, 140),
                  target_url: cla?.target_url ?? undefined,
                };
              }
              await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, context: 'cla/gate', ...status });
              core.info(`#${pr.number} ${pr.head.sha}: ${status.state} (${status.description})`);
            }
