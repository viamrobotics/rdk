name: Slack Failure Notification

# GitHub mails a scheduled run's result only to the account recorded as that
# schedule's actor. Callers route failures here so a channel sees them.

on:
  workflow_call:
    inputs:
      channel:
        description: 'Slack channel to post to'
        required: false
        default: '#team-devops'
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    name: Post Workflow Status To Slack
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Slack Workflow Notification
        # Gamesight/slack-workflow-status@v2.0.0
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ inputs.channel }}
          name: 'Workflow Status'
