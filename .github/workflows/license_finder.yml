name: License Finder

on:
  workflow_dispatch:
  workflow_call:

jobs:
  license_finder:
    name: Audit 3rd-Party Licenses
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    env:
      MISE_GO_SET_GOROOT: false
      MISE_ENABLE_TOOLS: 'go,ruby,gem:license_finder'

    steps:
    - name: Check out code
      if: github.event_name != 'pull_request_target'
      uses: actions/checkout@v7

    - name: Check out PR branch code
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        # Fork PRs only reach pull_request_target runs behind the 'safe to test' label (see pullrequest-trusted.yml).
        allow-unsafe-pr-checkout: true

    - name: Install toolchain
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      with:
        cache_key_prefix: "mise-v1-licensefinder"

    # The license checker needs to fetch all our go dependencies. This action
    # lets us pull them from cache in most cases.
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # A go.sum change misses the module cache, and one dropped proxy.golang.org stream among
    # hundreds of downloads fails the audit. Modules already fetched are kept between attempts.
    - name: Download go modules
      run: |
        for attempt in 1 2 3 4 5; do
          if go mod download; then
            exit 0
          fi
          echo "go mod download failed (attempt ${attempt} of 5)"
          sleep $((attempt * 5))
        done
        echo "::error::go mod download failed 5 times; proxy.golang.org is likely unreachable, re-run the job later"
        exit 1

    - name: Run license finder
      run: |
        make license-check
