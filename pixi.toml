[workspace]
name = "rdk"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
preview = ['pixi-build']

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"
CGO_CFLAGS = "-I$CONDA_PREFIX/include"
CGO_LDFLAGS = "-L$CONDA_PREFIX/lib"
GOCACHE = "$CONDA_PREFIX/cache/go-build"

[tasks]

[dependencies]
# Required build tools, might exist on the host but might as well define it
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
# cgo dependencies.
nlopt = { path = './etc/cgo-dependencies/nlopt' }
x264 = { path = './etc/cgo-dependencies/x264' }

[target.linux-64.dependencies]
# Old stuff to maintain compatibility with at least Ubuntu Focal.
gxx = "9.*"
sysroot_linux-64 = "2.28.*"
# Misc. extra tools.
patchelf = ">=0.19.1,<0.20"
# Static builds only supported on Linux for now.
nlopt-static = { path = './etc/cgo-dependencies/nlopt' }
x264-static = { path = './etc/cgo-dependencies/x264' }

[target.osx-arm64.dependencies]
clangxx = "*"
