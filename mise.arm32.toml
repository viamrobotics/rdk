 [settings]
 # Tools not available in upstream registries. Where possible they are built
 # from source in the `tools` section below.
 disable_tools = ['ffmpeg', 'buf', 'gotestsum', 'protoc-gen-go-grpc']

[tools]
"go:github.com/bufbuild/buf/cmd/buf" = "v1.71.0"
"go:gotest.tools/gotestsum" = "v1.13.0"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.5.1"
